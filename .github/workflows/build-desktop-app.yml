name: Build desktop app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact-name: NDIS-Deidentifier-windows
            dist-path: dist/NDIS-Deidentifier
          - os: macos-latest
            artifact-name: NDIS-Deidentifier-macos
            dist-path: dist/NDIS-Deidentifier.app
    runs-on: ${{ matrix.os }}
    env:
      # Keep tldextract's runtime cache out of its own package folder so it
      # never gets swept into the PyInstaller bundle (see comment in
      # packaging/presidio_deid.spec) - belt-and-braces alongside the
      # a.datas filter there.
      TLDEXTRACT_CACHE: ${{ runner.temp }}/tldextract-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download spaCy model
        run: python -m spacy download en_core_web_lg

      - name: Run tests
        run: |
          pip install pytest
          python -m pytest tests/ -v

      - name: Build with PyInstaller
        run: python -m PyInstaller packaging/presidio_deid.spec --noconfirm --distpath dist --workpath pybuild

      - name: Zip macOS .app
        if: matrix.os == 'macos-latest'
        run: ditto -c -k --sequesterRsrc --keepParent "${{ matrix.dist-path }}" "${{ matrix.artifact-name }}.zip"

      - name: Zip Windows build
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path "${{ matrix.dist-path }}" -DestinationPath "${{ matrix.artifact-name }}.zip"
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}.zip
          retention-days: 30
