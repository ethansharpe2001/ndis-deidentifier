name: Build desktop app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact-name: NDIS-Deidentifier-windows
            dist-path: dist/NDIS-Deidentifier
          - os: macos-latest
            artifact-name: NDIS-Deidentifier-macos
            dist-path: dist/NDIS-Deidentifier.app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Keep tldextract's runtime cache out of its own package folder so it
      # never gets swept into the PyInstaller bundle (see comment in
      # packaging/presidio_deid.spec) - belt-and-braces alongside the
      # a.datas filter there. `runner.temp` is only available inside a step,
      # so it's threaded into later steps via GITHUB_ENV rather than a
      # job-level `env:` block.
      - name: Keep tldextract cache out of site-packages
        shell: bash
        run: echo "TLDEXTRACT_CACHE=${{ runner.temp }}/tldextract-cache" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download spaCy model
        run: python -m spacy download en_core_web_lg

      - name: Run tests
        run: |
          pip install pytest
          python -m pytest tests/ -v

      - name: Build with PyInstaller
        run: python -m PyInstaller packaging/presidio_deid.spec --noconfirm --distpath dist --workpath pybuild

      - name: Zip macOS .app
        if: matrix.os == 'macos-latest'
        run: ditto -c -k --sequesterRsrc --keepParent "${{ matrix.dist-path }}" "${{ matrix.artifact-name }}.zip"

      - name: Zip Windows build
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path "${{ matrix.dist-path }}" -DestinationPath "${{ matrix.artifact-name }}.zip"
        shell: pwsh

      # Portable zip still ships (below) for anyone who wants it, but a real
      # installer is the primary distribution path: it removes the manual
      # "extract this huge zip somewhere" step, and defaults the install
      # location to somewhere already verified to leave plenty of headroom
      # under Windows' 260-character path limit (see installer.iss).
      # windows-latest ships Inno Setup preinstalled; the choco fallback is
      # just belt-and-braces in case that ever changes.
      - name: Build Windows installer (Inno Setup)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc packaging\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}.zip
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: NDIS-Deidentifier-windows-installer
          path: dist/installer/NDIS-Deidentifier-Setup.exe
          retention-days: 30
